name: Steam250 New Games

on:
  schedule:
    # 北京时间每天 14:05
    - cron: "5 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  steam250:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Steam250
        env:
          STEAM250_DISCORD_WEBHOOK: ${{ secrets.STEAM250_DISCORD_WEBHOOK }}
        run: |
          python steam250.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/steam250_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Steam250 state"
            git push
          fi
